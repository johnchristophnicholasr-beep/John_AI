name: Build John AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project files
        run: |
          echo "Repository contents:"
          find . -maxdepth 4 -type f | sort

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Missing settings.gradle or settings.gradle.kts"
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: Missing app directory"
            exit 1
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug
          else
            echo "ERROR: Gradle wrapper and Gradle installation are missing."
            exit 1
          fi

      - name: Upload John AI APK
        uses: actions/upload-artifact@v4
        with:
          name: John-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
